<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PureStep – ส่งรองเท้า & รับคิว</title>
<script>
/* ติดตั้งเป็นแอปได้เมื่อวางบน GitHub Pages (ใน Apps Script จะข้ามส่วนนี้) */
if (!/googleusercontent\.com|script\.google\.com/.test(location.hostname) && location.protocol === 'https:') {
  [['manifest','manifest.webmanifest'],['apple-touch-icon','apple-touch-icon.png'],['icon','icon-192.png']].forEach(([r,h]) => {
    const l = document.createElement('link'); l.rel = r; l.href = h; document.head.appendChild(l); });
}
</script>
<meta name="theme-color" content="#6b3a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PureStep">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#9a5f2c; --wood2:#c4853f; --wood-d:#5e3314; --ink:#4a2710;
  --cream:#fff7e8; --cream2:#fbe8c8; --red:#e23b33; --red-d:#b8241d;
  --blue:#2f6fdb; --blue-d:#1f4fa8; --gold:#f7c948; --green:#2e9d5b; --green-d:#1f7442;
  --line:#06c755;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}html{background:#7f4a20}
body{
  font-family:'Sarabun',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 92px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 7px),
    linear-gradient(180deg,#b9773a,#9a5f2c 40%,#7f4a20);
  background-attachment:fixed;
}
h1,h2,h3,.btn,.mitr{font-family:'Mitr','Sarabun',sans-serif;font-weight:500}
button,input,textarea{font:inherit;color:inherit}

/* top bar + awning */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));background:linear-gradient(#6b3a17,#5a2f11);box-shadow:0 2px 0 #3f200a}
.staff-btn{border:2px solid #f3d7a9;background:#fff3dc;color:var(--wood-d);border-radius:999px;
  padding:6px 14px;font-family:'Mitr',sans-serif;font-size:14px;cursor:pointer;box-shadow:0 2px 0 #c9a36d}
.staff-btn.on{background:var(--gold)}
.demo-tag{font-size:12px;color:#ffe9c2;opacity:.85;display:none}
.awning{height:34px;position:relative;
  background:repeating-linear-gradient(90deg,var(--red) 0 34px,#fff 34px 68px);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.awning:after{content:"";position:absolute;left:0;right:0;bottom:-16px;height:16px;
  background:radial-gradient(circle at 17px 0,var(--red) 16px,transparent 17px) 0 0/68px 16px repeat-x,
             radial-gradient(circle at 51px 0,#fff 16px,transparent 17px) 0 0/68px 16px repeat-x;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}

main{max-width:560px;margin:0 auto;padding:26px 14px 60px}
.view{display:none;animation:pop .28s ease}
.view.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{background:var(--cream);border:3px solid #e2b97f;border-radius:22px;padding:18px 16px;margin:14px 0;
  box-shadow:0 5px 0 #6e3d17,0 10px 22px rgba(40,15,0,.28);position:relative}
.card h2{margin:0 0 12px;font-size:19px;color:var(--wood-d)}
.center{text-align:center}

/* home */
.logo-wrap{width:min(250px,64vw);aspect-ratio:1;margin:4px auto 6px;border-radius:50%;
  background:#fff;padding:6px;box-shadow:0 0 0 5px #f0cf98,0 8px 0 5px #6e3d17,0 16px 28px rgba(0,0,0,.35);overflow:hidden}
.logo-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.shop-title{text-align:center;color:#fff6e3;margin:20px 0 2px;font-size:30px;font-weight:600;
  text-shadow:0 3px 0 var(--wood-d),0 0 14px rgba(255,220,150,.4);letter-spacing:.5px}
.tagline{text-align:center;color:#ffe7bd;margin:0 0 6px;font-family:'Mitr',sans-serif;font-size:15px}
.announce{display:none;background:#fff1c9;border:2px dashed var(--gold);color:var(--wood-d);
  border-radius:16px;padding:10px 14px;margin:12px 0;font-size:15px;white-space:pre-line}
.announce.on{display:block}
.board-title{display:flex;align-items:center;justify-content:space-between;font-family:'Mitr',sans-serif;font-size:18px;color:var(--wood-d)}
.live{font-size:12px;color:#fff;background:var(--red);border-radius:999px;padding:2px 9px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.55}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;min-height:44px;align-items:center}
.qchip{font-family:'Mitr',sans-serif;font-size:22px;background:linear-gradient(#3fb86f,var(--green));color:#fff;border-radius:14px;
  padding:4px 14px;box-shadow:0 3px 0 var(--green-d)}
.qchip.new{animation:bump .6s ease 2}
@keyframes bump{50%{transform:scale(1.18)}}
.muted{color:#9b7a5b;font-size:14px}
.board-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--cream2);border-radius:14px;padding:8px 12px;text-align:center}
.stat small{display:block;color:#8a6542;font-size:13px}
.stat b{font-family:'Mitr',sans-serif;font-size:26px;color:var(--wood-d);font-weight:500}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;
  padding:13px 16px;font-size:17px;cursor:pointer;text-decoration:none;margin:10px 0;transition:transform .08s}
.btn:active{transform:translateY(3px)}
.btn.big{font-size:20px;padding:16px}
.btn.primary{background:linear-gradient(#f05a4f,var(--red));color:#fff;box-shadow:0 5px 0 var(--red-d)}
.btn.blue{background:linear-gradient(#4b86ea,var(--blue));color:#fff;box-shadow:0 5px 0 var(--blue-d)}
.btn.green{background:linear-gradient(#3fb86f,var(--green));color:#fff;box-shadow:0 5px 0 var(--green-d)}
.btn.line{background:var(--line);color:#fff;box-shadow:0 5px 0 #049a41}
.btn.line.disabled{background:#b9c9bf;box-shadow:0 5px 0 #8fa196;pointer-events:none}
.btn.ghost{background:#fff3dc;color:var(--wood-d);box-shadow:0 4px 0 #c9a36d}
.btn.small{font-size:15px;padding:9px 12px;margin:4px 0;border-radius:14px}
.btn:disabled{opacity:.55}

.my-tickets{display:flex;flex-wrap:wrap;gap:8px}
.my-tickets .btn{flex:1 1 140px;width:auto}

.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;border:3px solid #f0cf98;
  box-shadow:0 4px 0 #6e3d17;cursor:pointer;background:#f6e3c4}
.gallery img:first-child:nth-last-child(odd){grid-column:1/-1;aspect-ratio:16/9}

/* steps */
.steps{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.step{font-family:'Mitr',sans-serif;font-size:13px;color:#ffe7bd;background:rgba(0,0,0,.18);padding:5px 12px;border-radius:999px}
.step.on{background:var(--gold);color:var(--wood-d)}

/* form */
label.f{display:block;font-weight:600;margin:10px 0 5px;color:var(--wood-d)}
.inp{width:100%;border:2px solid #e2c497;background:#fff;border-radius:14px;padding:12px 14px;font-size:17px;outline:none}
.inp:focus{border-color:var(--wood2);box-shadow:0 0 0 3px rgba(196,133,63,.2)}
.inp.err{border-color:var(--red);background:#fff4f3}
textarea.inp{min-height:90px;resize:vertical}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:54px;height:54px;border-radius:50%;border:0;font-size:30px;line-height:1;cursor:pointer;
  background:var(--wood2);color:#fff;box-shadow:0 4px 0 var(--wood-d)}
.stepper button:active{transform:translateY(3px)}
.stepper .n{font-family:'Mitr',sans-serif;font-size:38px;min-width:60px;text-align:center;color:var(--wood-d)}
.pair-no{display:inline-block;font-family:'Mitr',sans-serif;background:var(--blue);color:#fff;border-radius:999px;padding:3px 14px;font-size:15px;box-shadow:0 3px 0 var(--blue-d)}
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:2px solid #e2c497;border-radius:14px;
  z-index:20;overflow:hidden;box-shadow:0 10px 24px rgba(60,25,0,.25);display:none}
.ac-list.on{display:block}
.ac-item{padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #f4e6cf}
.ac-item:last-child{border-bottom:0}
.ac-item:hover,.ac-item.hl{background:var(--cream2)}
.ac-item mark{background:#ffe08a;color:inherit;border-radius:3px}
.ac-item small{color:#a88a6a;white-space:nowrap}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.ph{position:relative;width:88px;height:88px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:14px;border:2px solid #e2c497}
.ph button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;
  background:var(--red);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.add-photo{width:88px;height:88px;border:2.5px dashed var(--wood2);border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;background:#fff;color:var(--wood);font-size:26px}
.add-photo span{font-size:12px;font-family:'Mitr'}
.add-photo.err{border-color:var(--red);background:#fff4f3}
.hint{font-size:13.5px;color:#8a6542;margin:8px 0 0}

/* line page */
.line-badge{display:inline-block;background:var(--line);color:#fff;font-family:'Mitr',sans-serif;font-weight:600;border-radius:12px;padding:4px 14px;font-size:18px}
.qr{width:220px;height:220px;object-fit:contain;background:#fff;border-radius:18px;border:3px solid #cfeedd;padding:8px;margin:14px auto 6px;display:block}
.qr-ph{width:220px;height:220px;margin:14px auto 6px;border-radius:18px;border:3px dashed #9fd9b8;display:flex;align-items:center;justify-content:center;color:#5c9c78;font-size:14px;padding:20px;background:#f3fff8}
.benefits{list-style:none;padding:0;margin:14px 0 6px;text-align:left}
.benefits li{background:#fff;border:2px solid #f0dcb8;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:15.5px}
.line-id{font-family:'Mitr',sans-serif;color:#2c8a55}

/* ticket */
.ticket{text-align:center;padding:0;overflow:hidden}
.ticket-top{background:repeating-linear-gradient(90deg,var(--red) 0 26px,#fff 26px 52px);height:14px}
.ticket-head{font-family:'Mitr',sans-serif;color:var(--wood-d);margin:16px 0 0;font-size:17px}
.ticket-no{font-family:'Mitr',sans-serif;font-size:92px;line-height:1.05;color:var(--red);font-weight:600;text-shadow:0 4px 0 #f3c3b8}
.status-badge{display:inline-block;border-radius:999px;padding:6px 18px;font-family:'Mitr',sans-serif;font-size:17px;margin:6px 0 4px}
.st-r{background:#fff0c4;color:#8a5a00}
.st-y{background:#d6f5e2;color:#1b6b3d;animation:bump .7s ease 3}
.st-d{background:#e8e1d8;color:#6d5a48}
.ahead{font-size:16px;margin:6px 0 12px}
.ticket-info{border-top:2px dashed #e2c497;margin:10px 16px 0;padding:12px 4px;text-align:left;font-size:15px}
.ticket-info div{margin:3px 0}
.ready-cel{display:none;background:linear-gradient(#e9fbef,#d6f5e2);margin:0 16px 12px;border-radius:16px;padding:12px;font-family:'Mitr',sans-serif;color:#1b6b3d;font-size:18px}
.ready-cel.on{display:block}

/* staff */
.staff-head{display:flex;align-items:center;justify-content:space-between;color:#fff6e3}
.staff-head h2{margin:0;font-size:24px;text-shadow:0 2px 0 var(--wood-d)}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;border:0;border-radius:14px;padding:11px;font-family:'Mitr',sans-serif;font-size:16px;background:#f3dcb4;color:var(--wood-d);cursor:pointer;box-shadow:0 4px 0 #8a5528}
.tabs button.on{background:var(--gold)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters button{border:0;border-radius:999px;padding:7px 13px;background:#fff3dc;color:var(--wood-d);font-family:'Mitr',sans-serif;font-size:14px;white-space:nowrap;cursor:pointer}
.filters button.on{background:var(--blue);color:#fff}
.oc{padding:14px}
.oc-top{display:flex;align-items:center;gap:12px}
.oc-q{font-family:'Mitr',sans-serif;font-size:34px;color:var(--red);min-width:74px;text-align:center;background:#fff;border-radius:16px;border:2px solid #f0cfc8;line-height:1.25}
.oc-name{font-weight:700;font-size:17px}
.oc-meta{font-size:13.5px;color:#8a6542}
.oc-meta a{color:var(--blue)}
.oc-pairs{margin:10px 0 4px}
.oc-pair{background:#fff;border-radius:14px;padding:8px 10px;margin:6px 0;border:1.5px solid #f0dcb8}
.oc-pair .m{font-weight:600;margin-bottom:6px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;background:#f6e3c4}
.oc-act{display:flex;gap:8px}
.oc-act .btn{flex:1}
.set-row{display:flex;gap:12px;align-items:center}
.set-img{width:96px;height:96px;border-radius:16px;object-fit:cover;background:#fff;border:2px solid #e2c497;flex:none}
.g-edit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.g-edit .ph{width:auto;height:auto;aspect-ratio:1}
.inline{display:flex;gap:8px;align-items:center}
.inline .inp{flex:1}
.inline .btn{width:auto;margin:0}

/* overlays */
.modal{position:fixed;inset:0;background:rgba(40,18,4,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.modal .card{width:100%;max-width:380px;margin:0}
.lightbox img{max-width:100%;max-height:88vh;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.loading .box{background:var(--cream);border-radius:22px;padding:22px 26px;text-align:center;font-family:'Mitr',sans-serif;min-width:240px;box-shadow:0 6px 0 #6e3d17}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid #f0d6ad;border-top-color:var(--red);margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:10px;background:#f0d6ad;border-radius:999px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;z-index:60;
  background:#3b1e0a;color:#fff;border-radius:14px;padding:11px 18px;font-size:15px;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--red-d)}
.spark{position:fixed;pointer-events:none;z-index:70;font-size:22px;animation:fly 1.4s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
.foot{text-align:center;color:#ffe2b3;opacity:.75;font-size:12.5px;margin-top:24px}

/* language switch */
.lang{display:flex;background:#fff3dc;border:2px solid #f3d7a9;border-radius:999px;padding:2px;box-shadow:0 2px 0 #c9a36d}
.lang button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-family:'Mitr',sans-serif;font-size:13px;color:var(--wood-d);cursor:pointer;min-height:30px}
.lang button.on{background:var(--wood2);color:#fff}
/* express */
.express{display:flex;align-items:center;gap:12px;cursor:pointer;border-color:#f2c94c;background:linear-gradient(135deg,#fff8dc,#fff1c2)}
.express input{position:absolute;opacity:0;pointer-events:none}
.sw{flex:none;width:54px;height:32px;border-radius:999px;background:#e5cfa9;position:relative;transition:.2s;box-shadow:inset 0 2px 3px rgba(0,0,0,.15)}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.25);transition:.2s}
.express input:checked + .sw{background:#f0a400}
.express input:checked + .sw:after{left:25px}
.express input:focus-visible + .sw{outline:3px solid var(--blue);outline-offset:2px}
.ex-txt{flex:1}
.ex-txt b{display:block;font-family:'Mitr',sans-serif;font-weight:500;font-size:18px;color:#9a5a00}
.ex-txt small{color:#8a6542;font-size:14px}
.ex-total{font-family:'Mitr',sans-serif;font-size:17px;color:#fff;background:#f0a400;border-radius:12px;padding:4px 10px;white-space:nowrap;opacity:.35;transition:.2s}
.express.on{box-shadow:0 5px 0 #b97a00,0 0 0 4px rgba(247,201,72,.45),0 10px 22px rgba(40,15,0,.28)}
.express.on .ex-total{opacity:1}
.ex-badge{display:inline-block;background:#f0a400;color:#fff;font-family:'Mitr',sans-serif;border-radius:999px;padding:3px 12px;font-size:14px;margin:2px 0 6px}
.oc.ex{border-color:#f0a400;background:linear-gradient(#fff8dc,var(--cream) 40%)}
.demo-line{text-align:center;color:#ffe2b3;font-size:12px;opacity:.8;margin:-10px 0 6px;display:none}
.sub2{font-size:13px;color:#a88a6a;font-weight:400}

/* top bar right group */
.top-r{display:flex;align-items:center;gap:8px}
.acct-btn{position:relative;border:2px solid #f3d7a9;background:#fff3dc;color:var(--wood-d);border-radius:999px;padding:5px 12px;font-family:'Mitr',sans-serif;font-size:14px;cursor:pointer;box-shadow:0 2px 0 #c9a36d;white-space:nowrap;min-height:34px}
.acct-btn .nm{display:inline-block;max-width:104px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;line-height:20px;padding:0 5px;text-align:center;font-family:'Sarabun',sans-serif;font-weight:700;box-shadow:0 0 0 2px #fff;display:none}
.badge.on{display:block}
.btn .badge{position:static;display:none;margin-left:4px;box-shadow:none;background:#fff;color:var(--red)}
.btn .badge.on{display:inline-block}
.acct-card{display:flex;align-items:center;gap:12px}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(#4b86ea,var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Mitr',sans-serif;font-size:24px;flex:none;box-shadow:0 3px 0 var(--blue-d)}
.row2{display:flex;gap:8px}.row2 .btn{flex:1;margin:6px 0}
/* segmented */
.seg{display:flex;background:var(--cream2);border-radius:16px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:10px;font-family:'Mitr',sans-serif;font-size:16px;color:var(--wood-d);cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 2px 0 #e2c497}
/* PIN */
.pin{position:relative;display:flex;justify-content:center;gap:10px;margin:10px 0 6px;cursor:text}
.pin span{width:42px;height:52px;border-radius:14px;border:2.5px solid #e2c497;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--wood-d);transition:.15s}
.pin span.f{border-color:var(--wood2);background:#fff8ec}
.pin span.f:after{content:"";width:14px;height:14px;border-radius:50%;background:var(--wood-d)}
.pin span.cur{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,219,.2)}
.pin-in{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;color:transparent;background:transparent;caret-color:transparent}
.pin.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.known{background:var(--cream2);border-radius:18px;padding:14px;margin-bottom:6px}
.known b{font-family:'Mitr',sans-serif;font-size:20px;font-weight:500}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:14.5px;padding:6px}
/* orders (customer) */
.mo-top{display:flex;align-items:center;gap:12px}
.pay-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1.5px solid #f0dcb8;border-radius:14px;padding:8px 12px;margin-top:10px;flex-wrap:wrap}
.pay-row b{font-family:'Mitr',sans-serif;font-weight:500;font-size:18px}

.staff-tools{display:flex;gap:8px;margin-top:10px}.staff-tools .btn{margin:0}
.oc-act.wrap{flex-wrap:wrap}.oc-act.wrap .btn{flex:1 1 40%;white-space:nowrap;font-size:14.5px}

.staff-banner{background:#2f6fdb;color:#fff;border-radius:16px;padding:10px 14px;margin:10px 0;font-family:'Mitr',sans-serif}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ba figure{margin:0;text-align:center;font-size:12.5px;color:#8a6542}
.ba img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:2px solid #f0dcb8;cursor:pointer}

.kpi{background:#fff;border:2px solid #f0dcb8;border-radius:16px;padding:10px 12px}

.kpi b{font-family:'Mitr',sans-serif;font-weight:500;font-size:22px;color:var(--wood-d)}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:10px;border-bottom:2px solid #e2c497}

.bars div:hover:after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#3b1e0a;color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap}

.line-card{background:linear-gradient(#effaf3,#fff);border:2.5px solid #9fd9b8}
.code{font-family:'Mitr',sans-serif;font-size:24px;letter-spacing:2px;background:#fff;border:2px dashed var(--line);border-radius:12px;padding:6px 12px;display:inline-block;color:#167a43}

/* ===== print form ===== */
#printArea{display:none}
.pf *{box-sizing:border-box}
@media print{
  html,body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
.pf{width:275mm;box-sizing:border-box;margin:0 auto;font-family:'Sarabun',sans-serif;color:#3b1e0a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pf-awn{height:9mm;background:repeating-linear-gradient(90deg,#e23b33 0 12mm,#fff 12mm 24mm);border:1.5px solid #9a5f2c;border-bottom:0;border-radius:4mm 4mm 0 0}
.pf-head{display:flex;align-items:center;gap:5mm;border:1.5px solid #9a5f2c;border-top:0;padding:3mm 5mm;background:#fff7e8;
  background-image:repeating-linear-gradient(90deg,rgba(154,95,44,.05) 0 1px,transparent 1px 22mm)}

.pf-meta{font-size:11pt;line-height:2}

.pf-t th{background:#9a5f2c;color:#fff;font-family:'Mitr',sans-serif;font-weight:500;padding:2mm 1.5mm;border:1px solid #7f4a20;font-size:10.5pt;line-height:1.25}

.pf-t td.n{text-align:center;font-family:'Mitr',sans-serif;color:#e23b33;font-weight:500}
.pf-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:4mm;font-size:10.5pt;color:#7a4a20}
.pf-sign{text-align:center;min-width:60mm}

/* stamp card */
.stamp-card{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 5px 0 #6e3d17,0 10px 22px rgba(40,15,0,.28);margin:14px 0 6px;border:3px solid #e2b97f;background:#f6e3c4}
.stamp-card img.bg{display:block;width:100%}
.slot{position:absolute;width:12.4%;aspect-ratio:1;transform:translate(-50%,-50%);top:63.3%;border-radius:50%;display:flex;align-items:center;justify-content:center}
.slot img{width:100%;height:100%;border-radius:50%;opacity:.5;animation:stampIn .5s ease both}
.slot.new img{animation:stampIn .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampIn{from{transform:scale(1.8) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:.5}}
.stamp-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:14px;background:var(--cream)}

.btn.gold{background:linear-gradient(#ffd45e,#f0a400);color:#5a3300;box-shadow:0 4px 0 #b97a00}
.pts-tag{display:inline-block;background:#fff1c2;color:#8a5a00;border-radius:999px;padding:2px 10px;font-size:13px;font-family:'Mitr',sans-serif}

.panel{max-height:300px}

<body>
<header class="topbar">
  <button id="staffBtn" class="staff-btn" onclick="staffClick()" data-i="staff"></button>
  <div class="top-r">
    <button id="acctBtn" class="acct-btn" onclick="acctClick()"></button>
    <div class="lang" role="group" aria-label="Language">
      <button id="lgTh" onclick="setLang('th')">ไทย</button>
      <button id="lgEn" onclick="setLang('en')">EN</button>
      <button id="lgMy" onclick="setLang('my')">မြန်မာ</button>
    </div>
  </div>
</header>
<div class="awning"></div>

<main>
  <div id="demoLine" class="demo-line" data-i="demo"></div>

  <!-- HOME -->
  <section id="v-home" class="view on">
    <div class="logo-wrap"><img id="logoImg" alt="logo"></div>
    <h1 class="shop-title" id="shopName">PureStep</h1>
    <p class="tagline" id="tagline"></p>
    <div id="announce" class="announce"></div>

    <div class="card">
      <div class="board-title"><span data-i="readyNow"></span><span class="live">● LIVE</span></div>
      <div id="readyChips" class="chips"><span class="muted" data-i="loading"></span></div>
      <div class="board-row">
        <div class="stat"><small data-i="lastQ"></small><b id="lastQ">–</b></div>
        <div class="stat"><small data-i="inProg"></small><b id="waitCount">–</b></div>
      </div>
    </div>

    <button class="btn primary big" onclick="openForm()" data-i="cta"></button>
    <div id="homeAcct"></div>
    <div id="myTickets" class="my-tickets"></div>
    <button id="installBtn" class="btn ghost" onclick="installApp()" data-i="install"></button>
    <div id="gallery" class="gallery"></div>
    <div class="foot" data-i="foot"></div>
  </section>

  <!-- FORM -->
  <section id="v-form" class="view">
    <div class="steps"><span class="step on" data-i="step1"></span><span class="step" data-i="step2"></span><span class="step" data-i="step3"></span></div>
    <div id="formLoginHint"></div>
    <div id="staffBanner" class="staff-banner" style="display:none"></div>
    <div class="card">
      <h2 data-i="custInfo"></h2>
      <label class="f" for="fName" data-i="name"></label>
      <input id="fName" class="inp" autocomplete="name" data-ph="namePh" maxlength="80">
      <label class="f" for="fPhone" data-i="phone"></label>
      <input id="fPhone" class="inp" inputmode="tel" autocomplete="tel" placeholder="08x-xxx-xxxx" maxlength="12">
    </div>
    <div class="card center">
      <h2 data-i="howMany"></h2>
      <div class="stepper">
        <button type="button" onclick="setPairs(-1)" aria-label="−">−</button>
        <span class="n" id="pairCount">1</span>
        <button type="button" onclick="setPairs(1)" aria-label="+">+</button>
      </div>
      <div class="muted" style="margin-top:6px" data-i="pairsUnit"></div>
    </div>
    <div id="pairList"></div>
    <label class="card express" id="exBox">
      <input type="checkbox" id="fExpress" onchange="updExpress()">
      <span class="sw"></span>
      <span class="ex-txt"><b id="exTitle"></b><small data-i="exDesc"></small></span>
      <span class="ex-total" id="exTotal"></span>
    </label>
    <button class="btn primary big" onclick="submitForm()" data-i="confirm"></button>
    <button class="btn ghost" onclick="if(STAFF_ADD){STAFF_ADD=false;enterStaff()}else go('home')" data-i="back"></button>
  </section>

  <!-- LINE -->
  <section id="v-line" class="view">
    <div class="steps"><span class="step" data-i="step1"></span><span class="step on" data-i="step2"></span><span class="step" data-i="step3"></span></div>
    <div class="card center">
      <div style="font-size:15px;color:var(--green);font-family:'Mitr',sans-serif" data-i="sentOk"></div>
      <div class="line-badge" style="margin-top:10px">LINE</div>
      <h2 id="lineTitle" style="margin-top:10px"></h2>
      <div id="lineSub" class="muted"></div>
      <div id="qrBox"></div>
      <div id="lineIdText" class="line-id"></div>
      <ul id="lineBody" class="benefits"></ul>
      <a id="lineLink" class="btn line big" target="_blank" rel="noopener" onclick="afterLine()"></a>

function api(fn, ...args) {
  if (IS_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  if (API_URL) return fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) })
    .catch(() => { throw new Error('NETWORK'); })
    .then(r => r.text()).then(txt => { let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('NETWORK'); }
      if (!j.ok) throw new Error(j.error); return j.data; });
  return Mock[fn](...args);
}

function shrink(dataUrl, max, q){
  return new Promise((res, rej) => { const img = new Image(); img.onerror = rej; img.onload = () => {
    const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q || 0.75)); };
    img.src = dataUrl; });
}
function compress(file, max, q, type){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('BADIMG'));
    r.onload = () => { const img = new Image();
      img.onerror = () => rej(new Error('BADIMG'));
      img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        const x = c.getContext('2d'); if (type !== 'image/png') { x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); }
        x.drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL(type||'image/jpeg', q||0.8)); };
      img.src = r.result; };
    r.readAsDataURL(file);

}

    x.drawImage(pimg, sx + (S2 - w)/2, sy + (S2 - hh)/2, w, hh); x.restore(); y += PH; }
  if (tk.express) { rr(W/2-150, y, 300, 44, 22); x.fillStyle = '#f0a400'; x.fill(); x.fillStyle = '#fff'; x.font = F(500, 24); x.fillText(t('tExpress',{x:tk.fee}), W/2, y+31); y += 56; }

/* autocomplete: จำชื่อรุ่น + ค้นหาแบบใกล้เคียง */
function lev(a, b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function score(q, name){
  const a = norm(q), b = norm(name); if (!a) return 0;
  if (b === a) return 1000;
  if (b.startsWith(a)) return 900 - b.length;
  if (b.includes(a)) return 750 - b.indexOf(a);
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (toks.length > 1 && toks.every(x => b.includes(norm(x)))) return 650;
  let j = 0; for (const ch of b) { if (ch === a[j]) j++; if (j === a.length) break; }
  if (j === a.length && a.length >= 2) return 450;
  if (a.length >= 3) { let best = 99; for (let k = 0; k + a.length <= b.length + 1; k++) best = Math.min(best, lev(a, b.slice(k, k + a.length)));
    if (best <= Math.max(1, Math.floor(a.length / 4))) return 300 - best * 30; }
  return 0;
}
function hilite(name, q){ const i = name.toLowerCase().indexOf(q.toLowerCase().trim());
  return i < 0 || !q.trim() ? esc(name) : esc(name.slice(0,i)) + '<mark>' + esc(name.slice(i, i+q.trim().length)) + '</mark>' + esc(name.slice(i+q.trim().length)); }
let acSel = {};
function suggest(i){
  const q = $('m'+i).value, box = $('ac'+i);
  const list = !q.trim() ? MODELS.slice(0, 6).map(m => [m, 1])
    : MODELS.map(m => [m, score(q, m[0]) + Math.min(m[1], 40)]).filter(x => x[1] > 40 && norm(x[0][0]) !== norm(q)).sort((a,b) => b[1]-a[1]).slice(0, 7);
  acSel[i] = -1;
  if (!list.length) { box.classList.remove('on'); return; }
  box.innerHTML = (q.trim() ? '' : `<div class="ac-item" style="cursor:default;color:#a88a6a;font-size:13px">${t('popular')}</div>`) +
    list.map(([m]) => `<div class="ac-item" onmousedown="event.preventDefault();pickModel(${i},this.dataset.v)" data-v="${esc(m[0])}"><span>${hilite(m[0], q)}</span><small>${t('times',{n:m[1]})}</small></div>`).join('');
  box.classList.add('on');
}
function hideAc(i){ const b = $('ac'+i); if (b) b.classList.remove('on'); }
function pickModel(i, v){ pairs[i].model = v; $('m'+i).value = v; hideAc(i); }
function acKey(e, i){
  const items = [...$('ac'+i).querySelectorAll('.ac-item[data-v]')]; if (!items.length || !$('ac'+i).classList.contains('on')) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); acSel[i] = (acSel[i] + (e.key==='ArrowDown'?1:-1) + items.length) % items.length;
    items.forEach((x,k) => x.classList.toggle('hl', k === acSel[i])); }
  else if (e.key === 'Enter' && acSel[i] >= 0) { e.preventDefault(); pickModel(i, items[acSel[i]].dataset.v); }
  else if (e.key === 'Escape') hideAc(i);
}

function fitText(x, txt, maxW, size, weight){
  let s = size; x.font = `${weight} ${Math.round(s)}px Mitr, Sarabun, sans-serif`;
  while (x.measureText(txt).width > maxW && s > size * 0.55) { s -= 1; x.font = `${weight} ${Math.round(s)}px Mitr, Sarabun, sans-serif`; }
  let t2 = txt; while (x.measureText(t2).width > maxW && t2.length > 2) t2 = t2.slice(0, -2) + '…';
  return t2;
}
function drawLabels(){
  if (!LBL) return;
  const k = 8, W = Math.round(LBL_W * k), H = Math.round(LBL_H * k), n = LBL.rows.length, P = Math.round(H * 0.055);
  LBL_URLS = LBL.rows.map((r, i) => {
    const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.fillStyle = '#000'; x.textBaseline = 'middle';
    // แถบหัว: ชื่อร้าน + เลขคิว
    const hh = H * 0.2; x.fillRect(0, 0, W, hh); x.fillStyle = '#fff';
    x.font = `600 ${Math.round(hh * 0.62)}px Mitr, Sarabun, sans-serif`; x.textAlign = 'left';
    x.fillText((CFG.shopName || 'PureStep') + (LBL.express ? ' ⚡' : ''), P, hh / 2);
    x.textAlign = 'right'; x.font = `500 ${Math.round(hh * 0.5)}px Mitr, Sarabun, sans-serif`;
    x.fillText('#' + pad(LBL.q) + (n > 1 ? '  ' + t('lbPair',{i:i+1,n}) : ''), W - P, hh / 2);
    x.fillStyle = '#000'; x.textAlign = 'left';
    // ชื่อ / เบอร์ / รุ่น
    const lw = W - P * 2, lbl = (y, a, b, size, wt) => { x.font = `400 ${Math.round(size * 0.62)}px Mitr, Sarabun, sans-serif`; const aw = x.measureText(a).width + 6;
      x.fillStyle = '#555'; x.fillText(a, P, y); x.fillStyle = '#000'; x.fillText(fitText(x, b, lw - aw, size, wt), P + aw, y); };
    lbl(H * 0.33, t('lbName'), String(LBL.name || ''), H * 0.13, 600);
    lbl(H * 0.49, t('lbTel'), String(LBL.phone || ''), H * 0.11, 500);
    lbl(H * 0.65, t('lbShoe'), String(r.model || ''), H * 0.11, 500);
    // ราคา
    x.lineWidth = 2; x.setLineDash([6, 4]); x.beginPath(); x.moveTo(P, H * 0.76); x.lineTo(W - P, H * 0.76); x.stroke(); x.setLineDash([]);
    x.font = `400 ${Math.round(H * 0.08)}px Mitr, Sarabun, sans-serif`; x.fillStyle = '#555'; x.fillText(t('lbPrice'), P, H * 0.88);
    x.fillStyle = '#000'; x.textAlign = 'right'; x.font = `600 ${Math.round(H * 0.15)}px Mitr, Sarabun, sans-serif`;
    x.fillText(r.price ? money(r.price) + ' ฿' : '__________ ฿', W - P, H * 0.88);
    x.textAlign = 'left'; x.lineWidth = 2; x.strokeRect(1, 1, W - 2, H - 2);
    return c.toDataURL('image/png');
  });
  $('lblGrid').innerHTML = LBL_URLS.map(u => `<img src="${u}" style="width:${Math.min(300, W)}px" alt="">`).join('');
}
function printLabels(){
  $('pageStyle').textContent = `@page{size:${LBL_W}mm ${LBL_H}mm;margin:0}`;
  $('printArea').innerHTML = LBL_URLS.map((u, i) => `<img src="${u}" style="display:block;width:${LBL_W}mm;height:${LBL_H}mm;${i < LBL_URLS.length-1 ? 'page-break-after:always;' : ''}">`).join('');

/* ===== พิมพ์ตรงไป Phomemo M110 ผ่าน Bluetooth (Android Chrome / iPhone ผ่านแอป Bluefy) ===== */
let BT = { dev:null, ch:null, busy:false };
const isIOS = () => /iPhone|iPad|iPod/i.test(navigator.userAgent);
function renderBtBox(){
  const ok = !!(navigator.bluetooth && navigator.bluetooth.requestDevice);
  $('btBox').innerHTML = ok
    ? `<button class="btn primary big" id="btBtn" onclick="btPrint()">${BT.ch ? t('btPrintOn',{n:BT.dev.name || 'M110'}) : t('btPrint')}</button>
       <div class="row2" style="align-items:center"><label class="muted" style="font-size:13px;flex:1">${t('btDark')}</label>
       <input id="btDark" type="range" min="1" max="15" value="${store('btDark') || 10}" style="flex:1.4" onchange="store('btDark',+this.value)"></div>
       ${BT.dev ? `<button class="link" onclick="btForget()">${t('btSwitch')}</button>` : ''}`
    : `<div class="g-note" style="text-align:left">${isIOS() ? t('btIos') : t('btNo')}</div>`;
}
async function btConnect(){
  if (BT.ch && BT.dev && BT.dev.gatt.connected) return BT.ch;
  if (!BT.dev) BT.dev = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:[0xff00, 0xffe0, 0xae30] });
  const gatt = await BT.dev.gatt.connect();
  await sleep(150);
  const srv = await gatt.getPrimaryService(0xff00);
  BT.ch = await srv.getCharacteristic(0xff02);
  const pr = BT.ch.properties || {};
  BT.withResp = !pr.writeWithoutResponse && !!pr.write;          // บางเครื่องต้องเขียนแบบรอตอบกลับ
  try { BT.nt = await srv.getCharacteristic(0xff03); await BT.nt.startNotifications(); } catch(e) { BT.nt = null; }   // เปิดการแจ้งสถานะจากเครื่องพิมพ์
  if (!BT.listen) { BT.listen = true; BT.dev.addEventListener('gattserverdisconnected', () => { BT.ch = null; }); }
  return BT.ch;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function btSend(part){
  const buf = new Uint8Array(part).buffer;
  if (BT.withResp) return BT.ch.writeValue(buf);
  try { await BT.ch.writeValueWithoutResponse(buf); }
  catch(e) { BT.withResp = true; await BT.ch.writeValue(buf); }
}
async function btWrite(bytes, onProg){
  const size = 128;
  for (let i = 0; i < bytes.length; i += size) {
    await btSend(bytes.slice(i, i + size));
    await sleep(20);
    if (onProg) onProg(Math.min(100, Math.round((i + size) / bytes.length * 100)));
  }
}
/* แปลงรูปป้ายเป็นจุดขาว/ดำ 384 จุด (หัวพิมพ์ 48 มม.) */
async function labelBitmap(url){
  const img = await new Promise((r, j) => { const im = new Image(); im.onload = () => r(im); im.onerror = j; im.src = url; });
  const W = 384, H = Math.round(LBL_H * 8), c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  const k = Math.min(W / img.width, H / img.height), w = img.width * k, h = img.height * k;
  x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  const d = x.getImageData(0, 0, W, H).data, bpr = W / 8, out = new Uint8Array(bpr * H);
  for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
    const p = (y * W + xx) * 4, lum = d[p] * 0.3 + d[p+1] * 0.59 + d[p+2] * 0.11;
    if (lum < 150) out[y * bpr + (xx >> 3)] |= 0x80 >> (xx & 7);
  }
  return { bpr, H, out };
}
async function btPrint(){
  if (BT.busy) return; BT.busy = true;
  const btn = $('btBtn');
  try {
    if (btn) btn.textContent = t('btConnecting');
    await btConnect();
    const dark = Math.min(15, Math.max(1, Number(($('btDark') || {}).value) || 10));
    for (let i = 0; i < LBL_URLS.length; i++) {
      const { bpr, H, out } = await labelBitmap(LBL_URLS[i]);
      // ลำดับคำสั่ง M110 (phomemo-tools): ความเร็ว → ความเข้ม → ชนิดกระดาษ → ภาพ → จบงาน
      await btSend([0x1b,0x4e,0x0d,0x05]); await sleep(30);          // speed 5
      await btSend([0x1b,0x4e,0x04,dark]); await sleep(30);          // density
      await btSend([0x1f,0x11,0x0a]); await sleep(30);               // กระดาษสติกเกอร์แบบมีช่องว่าง (gap)
      await btSend([0x1d,0x76,0x30,0x00, bpr & 255, bpr >> 8, H & 255, H >> 8]);   // GS v 0
      await btWrite(out, p => { if (btn) btn.textContent = t('btPrinting',{a:i+1,b:LBL_URLS.length}) + ' ' + p + '%'; });
      await sleep(300);
      await btSend([0x1f,0xf0,0x05,0x00, 0x1f,0xf0,0x03,0x00]);      // จบงาน
      await sleep(i < LBL_URLS.length - 1 ? 1500 : 500);
    }
    toast(t('btDone')); sparkle(8);
  } catch(e) {
    const m = String(e && (e.message || e.name) || e);
    if (/NotFoundError|cancel/i.test(String(e && e.name)) && !BT.ch) toast(t('btCancel'), true);
    else { toast(t('btFail') + ' ' + m, true); BT.ch = null; }
  }
  BT.busy = false; renderBtBox();
}
function btForget(){ try { BT.dev && BT.dev.gatt.connected && BT.dev.gatt.disconnect(); } catch(e) {} BT = { dev:null, ch:null, busy:false }; renderBtBox(); toast(t('btForgot')); }
async function shareLabels(){
  try {
    const files = await Promise.all(LBL_URLS.map(async (u, i) => new File([await (await fetch(u)).blob()], `label-${i+1}.png`, { type:'image/png' })));

let D_RANGE = 'month';
function rangeOf(k){
  const n = new Date(), d0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  if (k === 'today') return [d0.getTime(), d0.getTime() + 864e5];
  if (k === '7') return [d0.getTime() - 6*864e5, d0.getTime() + 864e5];
  if (k === 'month') return [new Date(n.getFullYear(), n.getMonth(), 1).getTime(), d0.getTime() + 864e5];
  if (k === 'last') return [new Date(n.getFullYear(), n.getMonth()-1, 1).getTime(), new Date(n.getFullYear(), n.getMonth(), 1).getTime()];
  return [0, d0.getTime() + 864e5];
}

/* staff chat */
async function loadThreads(){
  try { THREADS = await api('staffThreads', TOKEN); renderThreads(); } catch(e) { authFail(e); }
}
function renderThreads(){
  const total = THREADS.reduce((s, x) => s + (x.phone === TH.phone && sTab === 'c' ? 0 : x.unread), 0);
  const b = $('staffChatBadge'); b.textContent = total; b.classList.toggle('on', total > 0);
  if (TH.phone) return;
  $('thList').innerHTML = THREADS.length ? THREADS.map(x => {
    const pv = x.type === 'sys' ? t('sys_'+x.preview,{q:pad(x.q||''), n:''}) : x.type === 'sticker' ? t('stickerPv') : x.type === 'quote' ? '💰 ' + t('quoteH') : (x.type === 'img' || x.type === 'slip') && !x.preview ? t('picSent') : x.preview;
    return `<div class="th-item" onclick="openThread('${esc(x.phone)}')"><div class="avatar" style="width:44px;height:44px;font-size:20px">${esc(String(x.name).charAt(0).toUpperCase())}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:700">${esc(x.name)} <span class="chip-sm">${x.reg ? t('regTag') : t('guestTag')}</span></div>
      <div class="pv">${x.from==='S'?'↩ ':''}${esc(pv)}</div></div><div class="muted" style="font-size:12px;align-self:flex-start;margin-right:${x.unread?26:0}px">${fmtTime(x.lastTs)}</div>
      <span class="badge${x.unread?' on':''}">${x.unread}</span></div>`;
  }).join('') : `<div class="card center muted">${t('noThreads')}</div>`;
}
function openThread(phone){
  TH = { phone, msgs:[], last:0, orders:[], name:'', reg:false };
  if (sTab !== 'c') staffTab('c');
  $('thList').style.display = 'none'; $('thView').style.display = '';
  $('thName').textContent = '…'; $('thPhone').textContent = fmtPhone(phone); $('sChatList').innerHTML = ''; $('thOrders').innerHTML = '';
  loadThread(true); scrollTo({top:0});
}
function closeThread(){ TH.phone = ''; $('thView').style.display = 'none'; $('thList').style.display = ''; loadThreads(); }
async function loadThread(force){
  if (!TH.phone || thBusy) return; thBusy = true;
  const ph = TH.phone;
  try { const r = await api('staffMessages', TOKEN, ph, force ? 0 : TH.last);
    if (ph !== TH.phone) { thBusy = false; return; }
    if (force) TH.msgs = [];
    const add = (r.msgs || []).filter(m => !TH.msgs.some(x => x.id === m.id));
    TH.msgs = TH.msgs.concat(add); if (TH.msgs.length) TH.last = TH.msgs[TH.msgs.length-1].ts;
    TH.orders = r.orders || []; TH.name = r.name; TH.reg = r.reg; TH.points = r.points;
    renderThread(force || add.length > 0);
  } catch(e) { authFail(e); }
  thBusy = false;
}
function renderThread(scroll){
  $('thName').textContent = TH.name || TH.phone; $('thPhone').innerHTML = `📞 <a href="tel:${esc(TH.phone)}">${esc(fmtPhone(TH.phone))}</a> · ${TH.reg ? t('regTag') : t('guestTag')}${TH.points ? ` · <span class="pts-tag">${t('custPts',{n:TH.points.bal})}</span>` : ''}`;
  $('thReset').style.display = TH.reg ? '' : 'none';
  $('thOrders').innerHTML = TH.orders.filter(o => o.status !== ST.D || o.pay === PAY.SENT || !o.pts).slice(0, 8).map(o => `<div class="th-o"><b>${pad(o.q)}</b> ${o.express?'⚡':''} · ${stLabel(o.status)}<br>${o.models.map(esc).join(', ')}
    ${o.price ? `<div>${money(o.price)} ฿ ${payPill(o.pay)}</div>` : ''}
    ${o.pay === PAY.SENT || (o.pay === PAY.WAIT && o.src === 'staff') ? `<button class="btn green small" onclick="confirmPay('${o.id}')">${t('btnConfirmPay')}</button>` : o.pay !== PAY.PAID && o.status !== ST.D ? `<button class="btn ghost small" onclick="openQuote('${o.id}','${esc(TH.phone)}')">${t('btnQuote')}</button>` : ''}
    ${o.status === ST.D && !o.pts ? `<button class="btn gold small" onclick="givePoints('${o.id}')">${t('btnGivePts',{n:o.pairs||o.models.length})}</button>` : ''}</div>`).join('') || '';
  $('thOrders').style.display = $('thOrders').innerHTML ? '' : 'none';
  const box = $('sChatList');
  const atBottom = scroll || box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = (TH.reg ? '' : `<div class="sys">${t('guestNote')}</div>`) + TH.msgs.map(m => msgHTML(m, 'S', TH.orders)).join('');
  if (atBottom) box.scrollTop = box.scrollHeight;
}
let Q_OID = null, Q_PHONE = null;
function openQuote(oid, phone){
  const o = SQ.find(x => x.id === oid) || TH.orders.find(x => x.id === oid); if (!o) return;
  Q_OID = oid; Q_PHONE = phone;
  $('qOrderTxt').innerHTML = `${pad(o.q)} · ${esc(o.name)} · ${o.models.map(m => esc(String(m).replace(/^\d+\.\s*/,''))).join(', ')}${o.express ? `<br>⚡ ${t('exInc',{x:o.fee})}` : ''}`;
  $('qAmt').value = o.price || ''; $('qNote').value = ''; $('qUse').checked = false; $('qRewardBox').style.display = 'none'; $('qReward').style.display = 'none';
  Q_PAIRS = o.pairs || o.models.length || 1; Q_PTS = null;
  Q_WANT = [...new Set((o.services || []).flat())]; Q_LINES = []; Q_EX = o.express ? (o.fee || 0) : 0;
  const G = guide(); Q_TAB = (G.find(g => Q_WANT.includes(g.key)) || G[0] || {}).key;
  renderGuide(); renderQLines();
  openM('mQuote');
  api('staffPoints', TOKEN, phone).then(p => { Q_PTS = p; const need = Number(CFG.rewardNeed) || 5;
    if (p.bal >= need) { $('qReward').style.display = ''; $('qUseTxt').innerHTML = '🎁 ' + t('useReward',{pct:Number(CFG.rewardPct)||10, need, n:p.bal}); } }).catch(() => {});
}
let Q_PAIRS = 1, Q_PTS = null, Q_WANT = [], Q_LINES = [], Q_TAB = '', Q_EX = 0;
const guide = () => (SCFG && SCFG.priceGuide) || DEFAULT_GUIDE;
function renderGuide(){
  const G = guide(), g = G.find(x => x.key === Q_TAB) || G[0]; if (!g) { $('qgTabs').innerHTML = ''; $('qgBody').innerHTML = ''; return; }
  $('qgTabs').innerHTML = G.map(x => `<button class="${x.key === g.key ? 'on' : ''}${Q_WANT.includes(x.key) ? ' want' : ''}" onclick="Q_TAB='${esc(x.key)}';renderGuide()">${esc(x.name)}</button>`).join('');
  let last = '';
  $('qgBody').innerHTML = `<div class="muted" style="font-size:13px;margin-bottom:4px">${t('gPick')}</div>` + (g.note ? `<div class="g-note">💡 ${esc(g.note)}</div>` : '') +
    g.items.map((it, i) => { const grp = it.g !== last ? `<div class="g-grp">${esc(it.g)}</div>` : ''; last = it.g;
      const on = Q_LINES.some(l => l.k === g.key + ':' + i);
      return grp + `<div class="g-item${on ? ' on' : ''}" onclick="addLine('${esc(g.key)}',${i})"><span>${on ? '✅' : '➕'} ${esc(it.n)}</span><span class="pr">${it.p2 ? money(it.p) + '–' + money(it.p2) : money(it.p)} ฿</span></div>`; }).join('');
}
function addLine(key, i){
  const g = guide().find(x => x.key === key), it = g.items[i], k = key + ':' + i, j = Q_LINES.findIndex(l => l.k === k);
  if (j > -1) Q_LINES.splice(j, 1); else Q_LINES.push({ k, name: it.n, full: (it.g && it.g !== it.n ? it.g + ' · ' : '') + it.n, cat: g.name, price: it.p, qty: 1 });
  renderGuide(); renderQLines(true);
}
function renderQLines(fill){
  const lines = Q_LINES.map((l, j) => `<div class="q-line"><span>${esc(l.name)} <small class="muted">· ${esc(l.cat)}</small></span>
    <input class="qty" type="number" min="1" value="${l.qty}" oninput="Q_LINES[${j}].qty=Math.max(1,+this.value||1);sumLines()"><span style="flex:none">×</span>
    <input type="number" min="0" value="${l.price}" oninput="Q_LINES[${j}].price=+this.value||0;sumLines()"><button onclick="Q_LINES.splice(${j},1);renderGuide();renderQLines(true)">✕</button></div>`).join('');
  const ex = Q_EX ? `<div class="q-line"><span>⚡ ${t('gExpress')}</span><b>${money(Q_EX)} ฿</b></div>` : '';
  $('qLines').innerHTML = (lines || ex) ? lines + ex + `<div class="q-sum" id="qSum"></div>` : '';
  $('qLines').style.display = (lines || ex) ? '' : 'none';
  sumLines(fill);
}
function sumLines(fill){
  const tot = Q_LINES.reduce((a, l) => a + l.price * l.qty, 0) + (Q_LINES.length ? Q_EX : 0);
  if ($('qSum')) $('qSum').textContent = t('gSum',{x:money(tot)});
  if (Q_LINES.length) {
    $('qAmt').value = tot;
    $('qNote').value = Q_LINES.map(l => '• ' + (l.full || l.name) + (l.qty > 1 ? ' ×' + l.qty : '')).join('\n') + (Q_EX ? '\n• ' + t('gExpress') : '');
  } else if (fill) { $('qNote').value = ''; }
  calcReward();
}
function calcReward(){
  const use = $('qUse').checked; $('qRewardBox').style.display = use ? '' : 'none'; if (!use) return;
  const amt = Math.round(Number($('qAmt').value) || 0);
  if (!$('qBase').value && amt) $('qBase').value = Math.round(amt / Q_PAIRS);
  const base = Math.round(Number($('qBase').value) || 0), d = Math.round(base * (Number(CFG.rewardPct) || 10) / 100);
  $('qCalc').innerHTML = amt ? t('rewardCalc',{d:money(d), f:money(Math.max(0, amt - d))}) : '';
}
async function sendQuote(){
  const amt = Math.round(Number($('qAmt').value) || 0); if (amt <= 0) { toast(t('badAmt'), true); return; }
  try { loading(true, t('saving'), 60);
    const use = $('qUse').checked && $('qReward').style.display !== 'none';
    const d = use ? Math.round((Number($('qBase').value) || 0) * (Number(CFG.rewardPct) || 10) / 100) : 0;
    await api('staffSend', TOKEN, Q_PHONE, { type:'quote', oid:Q_OID, amount:Math.max(1, amt - d), text:$('qNote').value.trim(), useReward:use, discount:d });
    $('qBase').value = '';
    loading(false); closeM('mQuote'); toast(t('updated'));
    if (TH.phone === Q_PHONE) loadThread(true); if (sTab === 'q') loadStaff();
  } catch(e) { loading(false); if (!authFail(e)) toast(errMsg(e), true); }
}
async function resetPin(){
  if (!ask(t('resetAsk'))) return;
  try { await api('staffResetPin', TOKEN, TH.phone); toast(t('resetOk')); loadThread(true); } catch(e) { if (!authFail(e)) toast(errMsg(e), true); }
}

/* staff settings */
async function loadSettings(){
  try { SCFG = await api('staffGetConfig', TOKEN); fillSettings(); } catch(e) { if (!authFail(e)) toast(errMsg(e), true); }
}
const NOQR_SVG = () => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><text x="48" y="54" font-size="12" text-anchor="middle" fill="#b0906c">${esc(t('noQr'))}</text></svg>`);
function fillSettings(imagesOnly){
  const c = SCFG;
  $('sLogo').src = c.logo || DEFAULT_LOGO; $('sQr').src = c.lineQr || NOQR_SVG(); $('sPayQr').src = c.payQr || NOQR_SVG();
  fillGallery(c);
  if (imagesOnly) return;   // อัปรูปแล้ว ไม่ทับข้อความที่กำลังพิมพ์ค้างไว้
  QUICK = (c.quickReplies || QUICK || []).slice(); renderQuickEdit(); renderQuickBar();
  const map = { sShop:'shopName', sTag:'tagline', sTagEn:'taglineEn', sTagMy:'taglineMy', sAnn:'announcement', sAnnEn:'announcementEn', sAnnMy:'announcementMy', sExFee:'expressFee', sPayName:'payName',
    sRNeed:'rewardNeed', sRPct:'rewardPct', sLineTitleMy:'lineTitleMy', sLineSubMy:'lineSubMy', sLineBodyMy:'lineBodyMy',
    sLineUrl:'lineUrl', sLineId:'lineId', sLineTitle:'lineTitle', sLineTitleEn:'lineTitleEn', sLineSub:'lineSub', sLineSubEn:'lineSubEn', sLineBody:'lineBody', sLineBodyEn:'lineBodyEn' };
  for (const id in map) $(id).value = c[map[id]] ?? '';
  $('sNextQ').value = c.nextQueue || '';
  $('sRemindDays').value = c.remindDays || 3; $('sAutoRemind').checked = c.autoRemind !== false;
  $('sLabelW').value = c.labelW || 50; $('sLabelH').value = c.labelH || 30; $('sAppUrl').value = c.appUrl || '';
  const ln = Object.assign({}, DEFAULT_LN, c.lineNotify || {});
  $('lnToggles').innerHTML = Object.keys(DEFAULT_LN).map(k => `<label class="tog"><input type="checkbox" data-ln="${k}" ${ln[k] ? 'checked' : ''}><span>${t('ln_'+k)}</span></label>`).join('');
  GEDIT = JSON.parse(JSON.stringify(c.priceGuide || DEFAULT_GUIDE)); renderGuideEdit();
  loadLineStatus();
  $('sSheet').innerHTML = c.sheetUrl ? `${t('sheet')} <a href="${esc(c.sheetUrl)}" target="_blank">Google Sheet</a>` : '';
}
async function moveGal(i, d){
  const ids = (SCFG.gallery || []).map(g => g.id), j = i + d; if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  const old = SCFG.gallery.slice(); [SCFG.gallery[i], SCFG.gallery[j]] = [SCFG.gallery[j], SCFG.gallery[i]]; fillSettings(true);
  try { afterCfg(await api('staffSetGallery', TOKEN, ids), true); } catch(e) { SCFG.gallery = old; fillSettings(true); if (!authFail(e)) toast(errMsg(e), true); }
}
function fillGallery(c){
  const G = c.gallery || [];
  $('sGallery').innerHTML = G.map((g, i) => `<div class="ph"><img src="${esc(g.url)}" onclick="zoom(this.src)" alt=""><span class="no">${i+1}</span><button onclick="rmImg('gallery','${esc(g.id)}')">×</button>
    ${i > 0 ? `<button class="mv l" onclick="moveGal(${i},-1)">◀</button>` : ''}${i < G.length-1 ? `<button class="mv r" onclick="moveGal(${i},1)">▶</button>` : ''}</div>`).join('') || `<span class="muted" style="grid-column:1/-1">${t('noGal')}</span>`;
}
function afterCfg(c, imagesOnly){ SCFG = c; fillSettings(imagesOnly); CFG = Object.assign({}, CFG, c); cfgVer = c.ver; applyConfig(); updExpress(); }
async function upImg(inp, kind){
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  try { loading(true, t('upIng'), 40);
    const d = await compress(f, LIVE ? 900 : 500, 0.9, kind === 'logo' ? 'image/jpeg' : 'image/png');
    afterCfg(await api('staffUploadImage', TOKEN, kind, d), true); toast(t('upOk'));
  } catch(e) { if (!authFail(e)) toast(errMsg(e), true); }
  loading(false);
}
async function upGallery(inp){
  const files = [...inp.files]; inp.value = '';
  try { for (let i = 0; i < files.length; i++) { loading(true, `${t('upIng')} ${i+1}/${files.length}`, (i+1)/files.length*100);
      const d = await compress(files[i], LIVE ? 1400 : 600, LIVE ? 0.82 : 0.6);
      afterCfg(await api('staffUploadImage', TOKEN, 'gallery', d), true); }
    if (files.length) toast(t('galOk'));
  } catch(e) { if (!authFail(e)) toast(errMsg(e), true); }
  loading(false);
}
async function rmImg(kind, id){
  if (kind === 'gallery' && !ask(t('delGal'))) return;
  try { afterCfg(await api('staffRemoveImage', TOKEN, kind, id || ''), true); toast(t('updated')); } catch(e) { if (!authFail(e)) toast(errMsg(e), true); }
}
async function saveSettings(){
  const p = { shopName:$('sShop').value, tagline:$('sTag').value, taglineEn:$('sTagEn').value, taglineMy:$('sTagMy').value, announcement:$('sAnn').value, announcementEn:$('sAnnEn').value,
    announcementMy:$('sAnnMy').value, lineTitleMy:$('sLineTitleMy').value, lineSubMy:$('sLineSubMy').value, lineBodyMy:$('sLineBodyMy').value,
    rewardNeed:$('sRNeed').value, rewardPct:$('sRPct').value,
    expressFee:$('sExFee').value, payName:$('sPayName').value, lineUrl:$('sLineUrl').value.trim(), lineId:$('sLineId').value,
    lineTitle:$('sLineTitle').value, lineTitleEn:$('sLineTitleEn').value, lineSub:$('sLineSub').value, lineSubEn:$('sLineSubEn').value,
    lineBody:$('sLineBody').value, lineBodyEn:$('sLineBodyEn').value,
    remindDays:$('sRemindDays').value, autoRemind:$('sAutoRemind').checked, labelW:$('sLabelW').value, labelH:$('sLabelH').value, appUrl:$('sAppUrl').value,
    lineNotify: Object.fromEntries([...document.querySelectorAll('[data-ln]')].map(x => [x.dataset.ln, x.checked])) };
  try { loading(true, t('saving'), 60); afterCfg(await api('staffSaveConfig', TOKEN, p)); toast(t('saved')); }

}

async function lineTest(){ try { await api('staffLineTest', TOKEN); toast(t('lnTestOk')); } catch(e) { if (!authFail(e)) toast(errMsg(e), true); } }
/* price guide editor */
let GEDIT = [];
function renderGuideEdit(){
  $('gEdit').innerHTML = GEDIT.map((g, gi) => `<div class="ge-tab"><b style="font-family:'Mitr',sans-serif">${esc(g.name)}</b>
    <input class="inp" style="margin:6px 0;font-size:14px" value="${esc(g.note || '')}" placeholder="${esc(t('gNote'))}" oninput="GEDIT[${gi}].note=this.value">
    <div class="ge-row muted" style="font-size:12px"><span>${t('gGroup')}</span><span>${t('gName')}</span><span>${t('gFrom')}</span><span>${t('gTo')}</span><span></span></div>
    ${g.items.map((it, ii) => `<div class="ge-row"><input value="${esc(it.g)}" oninput="GEDIT[${gi}].items[${ii}].g=this.value"><input value="${esc(it.n)}" oninput="GEDIT[${gi}].items[${ii}].n=this.value">
      <input type="number" value="${it.p}" oninput="GEDIT[${gi}].items[${ii}].p=+this.value"><input type="number" value="${it.p2 || ''}" oninput="GEDIT[${gi}].items[${ii}].p2=+this.value">
      <button onclick="GEDIT[${gi}].items.splice(${ii},1);renderGuideEdit()">✕</button></div>`).join('')}
    <button class="btn ghost small" onclick="GEDIT[${gi}].items.push({g:'${esc(g.items.length ? g.items[g.items.length-1].g : '')}',n:'',p:0});renderGuideEdit()">${t('gAdd')}</button></div>`).join('');
}
async function saveGuide(){
  try { loading(true, t('saving'), 60); const g = await api('staffSaveGuide', TOKEN, GEDIT); SCFG.priceGuide = g; GEDIT = JSON.parse(JSON.stringify(g)); renderGuideEdit(); toast(t('gSaved')); }
  catch(e) { if (!authFail(e)) toast(errMsg(e), true); }
  loading(false);
}
async function setNextQ(){
  const n = Number($('sNextQ').value); if (!(n >= 1)) return toast(t('e_BADQ'), true);
  if (!ask(t('askQ',{q:pad(n)}))) return;
  try { await api('staffSetNextQueue', TOKEN, n); toast(t('qOk')); } catch(e) { if (!authFail(e)) toast(errMsg(e), true); }
}
async function changePw(){
  const pw = $('sPw').value.trim(); if (pw.length < 4) return toast(t('e_PWSHORT'), true);
  try { await api('staffChangePassword', TOKEN, pw); $('sPw').value = ''; toast(t('pwOk')); } catch(e) { if (!authFail(e)) toast(errMsg(e), true); }
}

if (!IS_GAS && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* รูปจาก Google Drive: ถ้าลิงก์หลักโหลดไม่ขึ้น ลองลิงก์สำรองอัตโนมัติ */
document.addEventListener('error', e => {
  const im = e.target; if (!im || im.tagName !== 'IMG') return;
  const m = String(im.src).match(/googleusercontent\.com\/d\/([\w-]+)|[?&]id=([\w-]+)/); if (!m) return;
  const id = m[1] || m[2], n = Number(im.dataset.fb || 0);
  const alt = [`https://drive.google.com/thumbnail?id=${id}&sz=w1000`, `https://drive.google.com/uc?export=view&id=${id}`];
  if (n < alt.length) { im.dataset.fb = n + 1; im.src = alt[n]; }
}, true);
